<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Sanitize generated HTML for security -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- KaTeX: mathematical equation renderer -->  
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    >
 
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>

    <!-- Automatically renders LaTeX delimiters -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>

    <style>
        .ai-message p {
            margin: 0.6rem 0;
        }

        .ai-message h1,
        .ai-message h2,
        .ai-message h3 {
            font-weight: 600;
            margin: 1rem 0 0.5rem;
        }

        .ai-message ul {
            list-style: disc;
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }

        .ai-message ol {
            list-style: decimal;
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }

        .ai-message pre {
            overflow-x: auto;
            padding: 1rem;
            margin: 0.75rem 0;
            border-radius: 0.5rem;
            background: #020617;
        }

        .ai-message code {
            overflow-wrap: anywhere;
        }

        .ai-message blockquote {
            border-left: 3px solid #8b5cf6;
            padding-left: 1rem;
            margin: 0.75rem 0;
            color: #cbd5e1;
        }

        .ai-message table {
            display: block;
            overflow-x: auto;
            border-collapse: collapse;
            margin: 0.75rem 0;
        }

        .ai-message th,
        .ai-message td {
            border: 1px solid #475569;
            padding: 0.5rem;
        }

        .ai-message .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.5rem 0;
        }

        .ai-message a {
            color: #a78bfa;
            text-decoration: underline;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 text-white flex justify-center">

    <main class="w-full max-w-3xl h-screen flex flex-col px-4 sm:px-6">

        <!-- Header -->
        <header class="flex items-center gap-3 py-5 border-b border-white/10">
            <div class="w-10 h-10 rounded-2xl bg-violet-600 flex items-center justify-center text-xl">
                ✦
            </div>

            <div>
                <h1 class="font-semibold text-lg">Orbit</h1>
                <p class="text-xs text-slate-400">Your AI assistant</p>
            </div>

            <div class="ml-auto flex items-center gap-2 text-xs text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                Ready to chat
            </div>
        </header>

        <!-- Chat messages -->
        <div id="chat" class="flex-1 overflow-y-auto py-6 space-y-5">

            <div id="welcome" class="h-full flex flex-col items-center justify-center text-center">
                <div class="w-16 h-16 rounded-3xl bg-violet-500/10 border border-violet-400/20 flex items-center justify-center text-3xl mb-6">
                    ✦
                </div>

                <h2 class="text-3xl sm:text-4xl font-semibold tracking-tight">
                    What’s on your mind?
                </h2>

                <p class="text-slate-400 mt-3">
                    Ask a question. Let's figure it out together.
                </p>
            </div>

        </div>

        <!-- Message input -->
        <form id="form" class="pb-5 pt-3">
            <div class="flex items-end gap-3 p-2 rounded-2xl bg-slate-900 border border-white/10 focus-within:border-violet-500/60 transition">

                <input
                    id="msg"
                    type="text"
                    placeholder="Message Orbit..."
                    autocomplete="off"
                    class="flex-1 bg-transparent px-3 py-3 outline-none text-sm placeholder:text-slate-500 min-w-0"
                >

                <button
                    id="send"
                    type="submit"
                    aria-label="Send message"
                    class="w-11 h-11 shrink-0 rounded-xl bg-violet-600 hover:bg-violet-500 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center transition"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 19V5"/>
                        <path d="m5 12 7-7 7 7"/>
                    </svg>
                </button>

            </div>

            <p class="text-center text-xs text-slate-600 mt-3">
                AI can make mistakes. Check important information.
            </p>
        </form>

    </main>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("form");
        const input = document.getElementById("msg");
        const sendButton = document.getElementById("send");
        const welcome = document.getElementById("welcome");

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const text = input.value.trim();
            if (!text || sendButton.disabled) return;

            welcome?.remove();

            showMessage(text, "user");
            input.value = "";
            sendButton.disabled = true;

            const reply = showMessage("", "ai");

            // Keep the raw response while Gemini streams
            let fullResponse = "";

            try {
                const response = await fetch("/api/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok || !response.body) {
                    throw new Error("Could not get a response.");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();

                    if (done) break;

                    fullResponse += decoder.decode(value, {
                        stream: true
                    });

                    // Display incoming text while generating
                    reply.textContent = fullResponse;

                    chat.scrollTop = chat.scrollHeight;
                }

                // Flush any remaining decoded characters
                fullResponse += decoder.decode();

                // Convert Markdown to HTML
                const markdownHTML = marked.parse(fullResponse);

                // Sanitize HTML before inserting it into the page
                reply.innerHTML = DOMPurify.sanitize(markdownHTML);

                // Render LaTeX equations and mathematical symbols
                renderMathInElement(reply, {
                    delimiters: [
                        { left: "$$", right: "$$", display: true },
                        { left: "\\[", right: "\\]", display: true },
                        { left: "\\(", right: "\\)", display: false },
                        { left: "$", right: "$", display: false }
                    ],
                    throwOnError: false,
                    strict: "ignore"
                });

                chat.scrollTop = chat.scrollHeight;

            } catch (error) {
                reply.textContent =
                    "Something went wrong. Please try again.";

                console.error("Chat error:", error);

            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        });

        function showMessage(text, sender) {
            const row = document.createElement("div");

            row.className = "flex " +
                (sender === "user" ? "justify-end" : "justify-start");

            const bubble = document.createElement("div");

            bubble.className = sender === "user"
                ? "max-w-[85%] rounded-2xl rounded-br-sm bg-violet-600 px-4 py-3 text-sm leading-7 whitespace-pre-wrap break-words"
                : "ai-message max-w-[90%] rounded-2xl rounded-bl-sm bg-slate-900 border border-white/10 px-4 py-3 text-sm leading-7 break-words overflow-x-auto";

            // User messages remain plain text
            bubble.textContent = text;

            row.appendChild(bubble);
            chat.appendChild(row);

            chat.scrollTop = chat.scrollHeight;

            return bubble;
        }

        input.focus();
    </script>

</body>
</html>
